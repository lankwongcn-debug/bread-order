<!doctype html>
<html lang="zh-HK"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bread Order</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
background:#f4f6fa;color:#16233c;padding-bottom:150px}
header{background:#7a4a1f;color:#fff;padding:14px 16px 13px;position:sticky;top:0;z-index:10;
box-shadow:0 2px 10px rgba(0,0,0,.18)}
h1{margin:0 0 4px;font-size:18px;letter-spacing:.2px}
.hint{font-size:11.5px;opacity:.78;margin-bottom:9px;line-height:1.35}
.meta{display:flex;gap:8px;align-items:center}
.meta input{flex:1;min-width:0;padding:10px 11px;border:0;border-radius:9px;font-size:16px;
background:rgba(255,255,255,.16);color:#fff}
.meta input::placeholder{color:rgba(255,255,255,.7)}
#dow{flex:none;font-size:14px;font-weight:700;padding:0 4px;white-space:nowrap}
.wrap{padding:10px 12px}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:10px;
padding:11px 10px 11px 13px;margin-bottom:6px;box-shadow:0 1px 2px rgba(20,35,60,.07)}
.row.on{background:#fff5e8;box-shadow:0 0 0 1.5px #c98a3c inset}
.row.zero{opacity:.5}
.nm{flex:1;min-width:0;font-size:15.5px;font-weight:600}
input[type=number]{width:74px;flex:none;padding:11px 6px;text-align:center;font-size:17px;
font-weight:700;border:1.5px solid #ccd4e2;border-radius:9px;background:#fbfcfe;color:#16233c}
input[type=number]:focus{outline:none;border-color:#7a4a1f;background:#fff}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
textarea{width:100%;margin-top:14px;padding:12px;border:1.5px solid #ccd4e2;border-radius:10px;
background:#fff;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
color:#16233c;resize:vertical}
textarea:focus{outline:none;border-color:#7a4a1f}
textarea.on{background:#fff5e8;border-color:#c98a3c}
footer{position:fixed;left:0;right:0;bottom:0;background:#fff;padding:10px 12px 15px;
box-shadow:0 -3px 14px rgba(20,35,60,.16)}
#cnt{text-align:center;font-size:13px;color:#5a6782;margin-bottom:8px}
#cnt b{color:#7a4a1f;font-size:16px}
button{width:100%;padding:15px;border:0;border-radius:11px;font-size:16.5px;font-weight:700;
color:#fff;background:#25d366;margin-bottom:7px}
.two{display:flex;gap:7px;margin-bottom:0}
.two button{margin:0;padding:11px;font-size:14px;background:#5a6782}
.two button.red{background:#c0392b}
button:disabled{background:#c3cad6}
#saved{text-align:center;font-size:11px;color:#8b95a7;margin-top:7px}
</style></head><body>

<header>
  <h1>BREAD ORDER</h1>
  <div class="hint">已經填好平日常用數量 — 改咗要改嘅,撳綠色掣發出<br>
  Usual quantities pre-filled. Adjust, then send.</div>
  <div class="meta">
    <input id="when" type="date" onchange="upd()">
    <span id="dow"></span>
    <input id="who" placeholder="你個名 / Name" oninput="save()">
  </div>
</header>

<div class="wrap">
<label class="row"><span class="nm">White Sourdough</span><input type="number" inputmode="numeric" min="0" step="1" data-n="White Sourdough" data-def="3" value="3" oninput="upd()"></label>
<label class="row"><span class="nm">Wholemeal</span><input type="number" inputmode="numeric" min="0" step="1" data-n="Wholemeal" data-def="1" value="1" oninput="upd()"></label>
<label class="row"><span class="nm">White Cottage</span><input type="number" inputmode="numeric" min="0" step="1" data-n="White Cottage" data-def="1" value="1" oninput="upd()"></label>
<label class="row"><span class="nm">Soy &amp; Linseed</span><input type="number" inputmode="numeric" min="0" step="1" data-n="Soy &amp; Linseed" data-def="1" value="1" oninput="upd()"></label>
<label class="row"><span class="nm">Raisin Toast</span><input type="number" inputmode="numeric" min="0" step="1" data-n="Raisin Toast" data-def="1" value="1" oninput="upd()"></label>
<label class="row"><span class="nm">Burger Bun</span><input type="number" inputmode="numeric" min="0" step="1" data-n="Burger Bun" data-def="2" value="2" oninput="upd()"></label>
<label class="row"><span class="nm">Slider</span><input type="number" inputmode="numeric" min="0" step="1" data-n="Slider" data-def="1" value="1" oninput="upd()"></label>
<label class="row"><span class="nm">Croissant</span><input type="number" inputmode="numeric" min="0" step="1" data-n="Croissant" data-def="9" value="9" oninput="upd()"></label>
<label class="row"><span class="nm">Almond Croissant</span><input type="number" inputmode="numeric" min="0" step="1" data-n="Almond Croissant" data-def="6" value="6" oninput="upd()"></label>
<textarea id="note" rows="3" placeholder="特別備註 — 有其他要 order 嘅寫喺呢度&#10;Special notes" oninput="upd()"></textarea>
</div>

<footer>
  <div id="cnt"></div>
  <button id="send" onclick="send()">用 WhatsApp 發出 &rarr;</button>
  <div class="two">
    <button onclick="copyTxt()">複製文字 Copy</button>
    <button class="red" onclick="resetAll()">回復常用數量</button>
  </div>
  <div id="saved">自動儲存喺呢部手機 &middot; auto-saved on this phone</div>
</footer>

<script>
var KEY = 'bread-order-v1';
var qty = document.querySelectorAll('input[type=number]');
var who = document.getElementById('who');
var when = document.getElementById('when');
var note = document.getElementById('note');

var DOW_ZH = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
var DOW_EN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function todayStr(){
  var d = new Date(), m = d.getMonth() + 1, day = d.getDate();
  return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
}

// Build the date from its parts so the weekday is not shifted by the timezone.
function dowOf(v){
  if (!v) return '';
  var p = v.split('-');
  if (p.length !== 3) return '';
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  if (isNaN(d.getTime())) return '';
  return DOW_ZH[d.getDay()] + ' ' + DOW_EN[d.getDay()];
}

function save(){
  var o = {who: who.value, when: when.value, note: note.value, q: {}};
  for (var i = 0; i < qty.length; i++) o.q[qty[i].dataset.n] = qty[i].value;
  try { localStorage.setItem(KEY, JSON.stringify(o)); } catch(e){}
}

function load(){
  var raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e){}
  if (!raw){ when.value = todayStr(); return; }
  var o;
  try { o = JSON.parse(raw); } catch(e){ when.value = todayStr(); return; }
  who.value = o.who || '';
  when.value = o.when || todayStr();
  note.value = o.note || '';
  for (var i = 0; i < qty.length; i++){
    var v = o.q ? o.q[qty[i].dataset.n] : null;
    if (v != null) qty[i].value = v;
  }
}

function picked(){
  var out = [];
  for (var i = 0; i < qty.length; i++){
    if (qty[i].value !== '' && Number(qty[i].value) > 0)
      out.push({n: qty[i].dataset.n, q: Number(qty[i].value)});
  }
  return out;
}

function upd(){
  for (var i = 0; i < qty.length; i++){
    var n = Number(qty[i].value);
    qty[i].parentNode.className = (qty[i].value !== '' && n > 0) ? 'row on' : 'row zero';
  }
  document.getElementById('dow').textContent = dowOf(when.value);
  var nt = note.value.trim();
  note.className = nt ? 'on' : '';
  var p = picked(), units = 0;
  for (var j = 0; j < p.length; j++) units += p[j].q;
  document.getElementById('cnt').innerHTML = p.length
    ? '<b>' + p.length + '</b> 樣 &middot; 共 <b>' + units + '</b> 件'
    : '全部係零';
  document.getElementById('send').disabled = (p.length === 0 && !nt);
  save();
}

function build(){
  var p = picked(), units = 0;
  var t = 'BREAD ORDER\n';
  if (when.value) t += 'Date: ' + when.value + ' (' + dowOf(when.value) + ')\n';
  if (who.value.trim()) t += 'By: ' + who.value.trim() + '\n';
  t += '------------------\n';
  for (var i = 0; i < p.length; i++){ t += p[i].q + ' x ' + p[i].n + '\n'; units += p[i].q; }
  t += '------------------\n' + p.length + ' items · ' + units + ' pcs';
  var nt = note.value.trim();
  if (nt) t += '\n\n*** 備註 / NOTES ***\n' + nt;
  return t;
}

function send(){ location.href = 'https://wa.me/?text=' + encodeURIComponent(build()); }

function copyTxt(){
  var t = build();
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){ alert('已複製,貼落 WhatsApp 就得'); },
      function(){ prompt('複製呢段文字:', t); });
  } else { prompt('複製呢段文字:', t); }
}

function resetAll(){
  if (!confirm('回復平日常用數量?')) return;
  for (var i = 0; i < qty.length; i++) qty[i].value = qty[i].dataset.def;
  note.value = '';
  when.value = todayStr();
  upd();
}

load();
upd();
</script>
</body></html>
